name: notambourine

# Keep this name and the job ID stable: the required check uses both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-actions:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@9bfed8843ebbba09359555e605abfb49a7101326 # v1.12.8
    with:
      pnpm-pin: false
