name: notambourine

# Keep this name and the job ID stable: the required check uses both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-actions:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@077a995f69e3bbf23bfa062af5be716c4e02ce4f # v1.11.1
    with:
      pnpm-pin: false
