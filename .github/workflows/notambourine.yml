name: notambourine

# Keep this name and the job ID stable: the required check uses both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fleet-actions:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@ba0de050f761500bc0aa23acd0fd5a03211e2377 # v1.12.7
    with:
      pnpm-pin: false
