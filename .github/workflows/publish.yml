name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # No sfw here: its registry proxy sits in front of the OIDC exchange npm publish
      # needs, and CI already installed this exact lockfile behind the firewall.
      - run: npm ci
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"
      - run: npm run check
      - run: npm test
      - run: npm publish
