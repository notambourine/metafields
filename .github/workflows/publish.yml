name: Publish

# Merging a version bump to main IS the release. A release created by GITHUB_TOKEN does
# not emit release:published, so tag, release, and publish all happen in one job.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      value: ${{ steps.read.outputs.value }}
      changed: ${{ steps.read.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD~1 is what the version is compared against.
          fetch-depth: 2
          persist-credentials: false
      - id: read
        run: |
          V=$(jq -r .version package.json)
          PREV=$(git show HEAD~1:package.json | jq -r .version)
          echo "value=$V" >>"$GITHUB_OUTPUT"
          if [ "$V" = "$PREV" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # No sfw here: its registry proxy sits in front of the OIDC exchange npm publish
      # needs, and CI already installed this exact lockfile behind the firewall.
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${VERSION}" --target "$GITHUB_SHA" --generate-notes
      - run: npm publish
