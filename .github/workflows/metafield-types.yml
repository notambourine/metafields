name: metafield-types freshness

# Shopify adds metafield types inside a live API version and the version pinned in src/admin.ts
# ages out, and neither shows up in a pull request. Off CI so an outage cannot fail someone's PR.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports only: an open issue outlives a red run nobody opens, and holding no ref write
    # keeps a compromised step away from the table it is watching.
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci

      - id: check
        name: Compare against the Admin API
        run: |
          npm run generate:metafield-types -- --check && CODE=0 || CODE=$?
          case "$CODE" in
            0) echo 'state=fresh' >>"$GITHUB_OUTPUT" ;;
            1) echo 'state=stale' >>"$GITHUB_OUTPUT" ;;
            # Exit 2 is an unreachable registry or an aged-out pin, and the script cannot tell
            # which; the issue body hands that call to a person.
            2) echo 'state=unknown' >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected exit $CODE from the freshness check"; exit 1 ;;
          esac

      - if: steps.check.outputs.state != 'fresh'
        name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.check.outputs.state }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue at a time, or the nightly re-check files a duplicate every morning.
          if gh issue list --label metafield-drift --state open --limit 1 \
               --json number -q '.[0].number' | grep -q .; then
            echo 'An open metafield-drift issue already covers this.'
            exit 0
          fi
          if [ "$STATE" = stale ]; then
            TITLE='metafield-types: the generated type table is stale'
            cat >"${RUNNER_TEMP}/body.md" <<EOF
          \`src/metafield-types.ts\` no longer matches the metafield type list Shopify serves for
          the pinned Admin API version.

          Regenerate it with \`npm run generate:metafield-types\` and ship the result with a version
          bump. Check the diff for new types the schema builders do not handle yet; that is the
          case this check exists to catch.

          Detected by [this run]($RUN). Closes automatically when the check next passes.
          EOF
          else
            TITLE='metafield-types: cannot determine freshness'
            cat >"${RUNNER_TEMP}/body.md" <<EOF
          The freshness check could not read the Admin API, so drift is currently unmonitored.

          Either shopify.dev was unreachable, which resolves on its own, or \`DEFAULT_API_VERSION\`
          in \`src/admin.ts\` has aged out of support and needs a supported version pinned.
          [The run log]($RUN) distinguishes them.

          Closes automatically when the check next passes.
          EOF
          fi
          gh issue create --label metafield-drift --title "$TITLE" \
            --body-file "${RUNNER_TEMP}/body.md"

      - if: steps.check.outputs.state == 'fresh'
        name: Close a resolved issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Self-healing, so a one-night shopify.dev outage does not leave an issue open.
          for N in $(gh issue list --label metafield-drift --state open --json number -q '.[].number'); do
            gh issue close "$N" --comment 'The generated type table matches the Admin API again.'
          done
