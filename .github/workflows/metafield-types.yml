name: metafield-types freshness

# Two things move under this repo with no signal: Shopify adds metafield types inside a live
# API version, and the version pinned in src/admin.ts eventually ages out of support. Neither
# shows up in a pull request, so check on a clock. A run that finds nothing stops after the
# check step, and one that finds something rebuilds the same branch, so daily costs a minute
# and only narrows the window. Kept out of CI so a shopify.dev outage cannot fail someone's PR.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push below authenticates with GITHUB_TOKEN explicitly.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci

      - id: check
        name: Compare against the Admin API
        run: |
          npm run generate:metafield-types -- --check && CODE=0 || CODE=$?
          case "$CODE" in
            0) echo 'stale=false' >>"$GITHUB_OUTPUT" ;;
            1) echo 'stale=true' >>"$GITHUB_OUTPUT" ;;
            # No pull request can fix an unreachable proxy or an aged-out version pin.
            *) echo '::error::cannot determine freshness; see the log'; exit 1 ;;
          esac

      - if: steps.check.outputs.stale == 'true'
        name: Regenerate and bump
        run: |
          npm run generate:metafield-types
          npm version patch --no-git-tag-version

      # A GITHUB_TOKEN push triggers no workflows, so the pull request this opens gets no CI
      # run. Gate it here instead: a new type can break the type-level tests, and that is
      # exactly the case a person needs to see before merging.
      - if: steps.check.outputs.stale == 'true'
        run: npm run check
      - if: steps.check.outputs.stale == 'true'
        run: npm test

      - if: steps.check.outputs.stale == 'true'
        name: Open or update the draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=chore/metafield-types
          TITLE='metafield-types: refresh from the Admin API'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add src/metafield-types.ts package.json package-lock.json
          git commit -m "$TITLE"
          # Always rebuilt from main, so the branch is force-pushed rather than appended to.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "Updated the open pull request on $BRANCH."
            exit 0
          fi
          cat >"${RUNNER_TEMP}/body.md" <<'EOF'
          Shopify changed the metafield type list. Regenerated by
          `.github/workflows/metafield-types.yml`; `npm run check` and `npm test` passed on this
          commit.

          Read the diff for types the schema builders do not cover yet before merging.
          EOF
          gh pr create --draft --base main --head "$BRANCH" --title "$TITLE" \
            --body-file "${RUNNER_TEMP}/body.md"
