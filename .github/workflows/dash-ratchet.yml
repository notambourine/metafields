name: Dash ratchet

# Unicode dashes may only decrease. Contract and inputs:
# https://github.com/notambourine/dash-ratchet
concurrency:
  group: dashes-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dashes:
    uses: notambourine/dash-ratchet/.github/workflows/ratchet.yml@556a4457c467fb9c28a3240f7f030bf9204cb357 # v0.4.0
